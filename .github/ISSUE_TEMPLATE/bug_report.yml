name: Bug report
description: Report a reproducible defect without sensitive information
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private keys, real server details, audit logs, or user-specific paths. Report security issues privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use example.com hostnames and redact all sensitive values.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include relevant error codes or sanitized `ai-ops doctor` output.
